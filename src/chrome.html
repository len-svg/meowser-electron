<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Meowser</title>
<style>
  *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    background: #ffffff; color: #1f1f1f;
    -webkit-user-select: none;
    display: flex; flex-direction: column;
  }

  /* ─── 顶部 profile 条（保留，给 emoji/name/mem）─── */
  .profile-strip {
    height: 22px; color: white; font-size: 11px; font-weight: 600;
    display: flex; align-items: center; padding: 0 12px; gap: 8px;
    -webkit-app-region: drag; flex-shrink: 0; cursor: pointer;
  }
  .profile-strip .note { font-weight: 400; opacity: 0.85; font-size: 10px; }
  .profile-strip .incog { background: rgba(0,0,0,0.4); padding: 1px 6px; border-radius: 3px; font-size: 10px; }
  .profile-strip .ver  { margin-left: auto; background: rgba(0,0,0,0.18); padding: 1px 6px; border-radius: 3px; font-size: 9px; font-family: ui-monospace, monospace; font-weight: 600; opacity: 0.85; }
  .profile-strip .mem  { background: rgba(0,0,0,0.25); padding: 1px 7px; border-radius: 3px; font-size: 10px; font-family: ui-monospace, monospace; font-weight: 600; -webkit-app-region: no-drag; cursor: help; }
  .profile-strip .mem.warn { background: rgba(255,149,0,0.7); }
  .profile-strip .mem.danger { background: rgba(255,59,48,0.8); }

  /* ─── Chrome 风工具栏 ─── */
  .toolbar {
    height: 44px; background: #f1f3f4;
    display: flex; align-items: center; gap: 2px; padding: 0 8px;
    flex-shrink: 0; -webkit-app-region: no-drag;
    border-bottom: 1px solid rgba(0,0,0,0.06);
  }

  /* 32×32 圆形 hover，无边框无背景 */
  .iconbtn {
    width: 32px; height: 32px;
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent; border: none; border-radius: 50%;
    cursor: pointer; color: #1f1f1f; padding: 0;
    transition: background 0.12s;
    flex-shrink: 0;
  }
  .iconbtn:hover { background: rgba(0,0,0,0.08); }
  .iconbtn:active { background: rgba(0,0,0,0.14); }
  .iconbtn:disabled { opacity: 0.35; cursor: default; background: transparent; }
  .iconbtn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .iconbtn.filled svg { fill: #f6c200; stroke: #c89b00; }

  .nav-group { display: flex; align-items: center; gap: 0; }

  /* ─── Omnibox ─── */
  .omnibox {
    flex: 1; height: 32px; margin: 0 8px;
    display: flex; align-items: center;
    background: #ffffff; border-radius: 16px;
    border: 1px solid transparent;
    transition: border-color 0.12s, box-shadow 0.12s;
    overflow: hidden;
  }
  .omnibox.focused {
    background: #ffffff;
    border-color: #1a73e8;
    box-shadow: 0 1px 6px rgba(32,33,36,0.15);
  }
  .omnibox .chip {
    display: inline-flex; align-items: center; gap: 4px;
    height: 24px; padding: 0 8px; margin-left: 4px;
    border-radius: 12px;
    font-size: 11px; font-weight: 600;
    background: rgba(0,0,0,0.05); color: #5f6368;
    cursor: pointer;
    flex-shrink: 0;
  }
  .omnibox .chip:hover { background: rgba(0,0,0,0.10); }
  .omnibox .chip svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2.2; }
  .omnibox .chip.proxy-direct { color: #5f6368; }
  .omnibox .chip.proxy-http   { color: #137333; background: rgba(19,115,51,0.10); }
  .omnibox .chip.proxy-socks  { color: #6c2bd9; background: rgba(108,43,217,0.10); }
  .omnibox .chip.proxy-system { color: #b06000; background: rgba(176,96,0,0.10); }

  .omnibox input {
    flex: 1; height: 100%; padding: 0 8px;
    border: none; background: transparent; outline: none;
    font-size: 13px; color: #202124;
    font-family: inherit;
  }
  .omnibox input::placeholder { color: #80868b; }

  /* URL bar 建议下拉 */
  #omnibox-suggest { padding: 4px 0; }
  #omnibox-suggest .sugg {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 12px; cursor: pointer;
    font-size: 13px; color: #1f1f1f;
  }
  #omnibox-suggest .sugg:hover, #omnibox-suggest .sugg.active { background: rgba(26,115,232,0.10); }
  #omnibox-suggest .sugg img { width: 14px; height: 14px; flex-shrink: 0; }
  #omnibox-suggest .sugg .t { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #omnibox-suggest .sugg .u { font-size: 11px; color: #80868b; font-family: ui-monospace, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  #omnibox-suggest .sugg .v { font-size: 10px; color: #80868b; padding: 1px 6px; background: rgba(0,0,0,0.04); border-radius: 8px; }
  #omnibox-suggest .sugg .hl { background: rgba(252,232,3,0.4); font-weight: 600; }

  .omnibox .star {
    width: 28px; height: 28px; margin-right: 2px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 50%; cursor: pointer; color: #5f6368;
  }
  .omnibox .star:hover { background: rgba(0,0,0,0.08); }
  .omnibox .star svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }
  .omnibox .star.on { color: #f6c200; }
  .omnibox .star.on svg { fill: #f6c200; stroke: #c89b00; }

  /* ─── 右侧 actions ─── */
  .actions { display: flex; align-items: center; gap: 0; }
  .actions .pinned-ext { display: flex; align-items: center; gap: 2px; padding-right: 4px; border-right: 1px solid rgba(0,0,0,0.10); margin-right: 4px; }
  .actions .pinned-ext:empty { display: none; }
  .ext-action-btn {
    width: 30px; height: 30px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 50%; cursor: pointer;
    background: transparent; border: none; padding: 0;
    transition: background 0.12s;
    position: relative;
  }
  .ext-action-btn:hover { background: rgba(0,0,0,0.08); }
  .ext-action-btn img { width: 18px; height: 18px; }
  .ext-action-btn.fallback {
    color: #5f6368; font-size: 13px; font-weight: 600;
    font-family: -apple-system, sans-serif;
  }
  .ext-action-btn .ext-badge {
    position: absolute; right: 1px; bottom: 1px;
    min-width: 14px; height: 14px; padding: 0 3px;
    border-radius: 7px;
    background: #d93025; color: white;
    font-size: 9px; font-weight: 600;
    display: inline-flex; align-items: center; justify-content: center;
    line-height: 1; box-shadow: 0 0 0 1.5px #f1f3f4;
  }
  .ext-action-btn.failed::after {
    content: ''; position: absolute; right: 4px; top: 4px;
    width: 6px; height: 6px; background: #d93025; border-radius: 50%;
    box-shadow: 0 0 0 1.5px #f1f3f4;
  }
  .ext-icon {
    width: 28px; height: 28px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 14px;
    color: #5f6368;
  }
  .ext-icon:hover { background: rgba(0,0,0,0.08); }

  /* ─── 弹层 ─── */
  .panel {
    position: fixed; z-index: 9999;
    background: white; border-radius: 8px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.18), 0 8px 24px rgba(0,0,0,0.16);
    min-width: 240px; max-width: 360px;
    padding: 6px 0;
    font-size: 13px; color: #202124;
    display: none;
  }
  .panel.show { display: block; }
  .panel .row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 16px; cursor: pointer;
    color: #202124;
  }
  .panel .row:hover { background: rgba(0,0,0,0.05); }
  .panel .row.disabled { color: #9aa0a6; cursor: default; }
  .panel .row.disabled:hover { background: transparent; }
  .panel .row .ico { width: 18px; flex-shrink: 0; display: inline-flex; justify-content: center; color: #5f6368; }
  .panel .row .ico svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }
  .panel .row .label { flex: 1; }
  .panel .row .accel { font-size: 11px; color: #80868b; font-family: ui-monospace, monospace; }
  .panel .row .check { font-size: 12px; color: #1a73e8; }
  .panel .sep { height: 1px; background: rgba(0,0,0,0.08); margin: 6px 0; }
  .panel .group-title { padding: 6px 16px 2px; font-size: 11px; color: #80868b; text-transform: uppercase; letter-spacing: 0.4px; }
  .panel .row.danger { color: #d93025; }
  .panel .opacity-row { padding: 8px 16px; }
  .panel .opacity-row label { display: block; font-size: 11px; color: #5f6368; margin-bottom: 4px; }
  .panel .opacity-row input { width: 100%; }

  /* 扩展面板 item */
  .ext-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 16px; cursor: default;
  }
  .ext-item:hover { background: rgba(0,0,0,0.04); }
  .ext-item .name { flex: 1; min-width: 0; }
  .ext-item .name b { display: block; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ext-item .name small { color: #80868b; font-size: 11px; }
  .ext-item .x { width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: #80868b; cursor: pointer; flex-shrink: 0; }
  .ext-item .x:hover { background: rgba(217,48,37,0.10); color: #d93025; }
  .ext-item.empty { color: #80868b; font-size: 12px; padding: 12px 16px; cursor: default; font-style: italic; }
  .ext-item.empty:hover { background: transparent; }

  /* ─── 书签栏 ─── */
  .bmbar {
    height: 30px; background: #fafafa;
    border-bottom: 1px solid rgba(0,0,0,0.06);
    display: flex; align-items: center; gap: 2px; padding: 0 8px;
    overflow-x: auto; overflow-y: hidden;
    flex-shrink: 0; -webkit-app-region: no-drag;
    scrollbar-width: none;
  }
  .bmbar::-webkit-scrollbar { display: none; }
  .bm {
    display: inline-flex; align-items: center; gap: 5px;
    height: 22px; padding: 0 8px;
    background: transparent; border: 0.5px solid transparent; border-radius: 5px;
    font-size: 11px; color: #1f1f1f; cursor: pointer;
    white-space: nowrap; flex-shrink: 0;
  }
  .bm:hover { background: rgba(0,0,0,0.05); border-color: rgba(0,0,0,0.08); }
  .bm img { width: 14px; height: 14px; flex-shrink: 0; }
  .bm.empty { color: #80868b; font-style: italic; cursor: default; }
  .bm.empty:hover { background: transparent; border-color: transparent; }

  webview { flex: 1; width: 100%; height: 100%; border: none; }

  /* 小窗精简 */
  body.small .toolbar { height: 36px; padding: 0 4px; }
  body.small .iconbtn { width: 28px; height: 28px; }
  body.small .iconbtn svg { width: 16px; height: 16px; }
  body.small .omnibox { height: 26px; margin: 0 4px; border-radius: 13px; }
  body.small .omnibox input { font-size: 12px; }
  body.small .omnibox .chip { display: none; }
  body.small .bmbar { display: none; }
  body.small #btn-back, body.small #btn-fwd, body.small .actions .pinned-ext { display: none; }
  body.small .actions { gap: 0; }
</style>
</head>
<body>
  <div class="profile-strip" id="strip" title="双击切换大窗/小窗"></div>

  <div class="toolbar">
    <div class="nav-group">
      <button class="iconbtn" id="btn-back" title="后退">
        <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <button class="iconbtn" id="btn-fwd" title="前进">
        <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
      <button class="iconbtn" id="btn-reload" title="刷新">
        <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
      </button>
    </div>

    <div class="omnibox" id="omnibox">
      <span class="chip" id="proxy-chip" title="代理状态">
        <svg viewBox="0 0 24 24"><path d="M12 2 4 6v6c0 5 3.5 9 8 10 4.5-1 8-5 8-10V6l-8-4z"/></svg>
        <span id="proxy-text">DIRECT</span>
      </span>
      <input id="url" placeholder="搜索 Google 或输入网址" spellcheck="false" autocomplete="off">
      <span class="star" id="star" title="收藏当前页 (⌘D)">
        <svg viewBox="0 0 24 24"><path d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
      </span>
    </div>

    <div class="actions">
      <div class="pinned-ext" id="pinned-ext"></div>
      <button class="iconbtn" id="btn-ext" title="扩展">
        <svg viewBox="0 0 24 24"><path d="M14 4h4a2 2 0 0 1 2 2v4h-2a2 2 0 0 0 0 4h2v4a2 2 0 0 1-2 2h-4v-2a2 2 0 0 0-4 0v2H6a2 2 0 0 1-2-2v-4H6a2 2 0 0 0 0-4H4V6a2 2 0 0 1 2-2h4v2a2 2 0 0 0 4 0V4z"/></svg>
      </button>
      <button class="iconbtn" id="btn-menu" title="菜单">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="19" r="1.5" fill="currentColor" stroke="none"/></svg>
      </button>
    </div>
  </div>

  <div class="bmbar" id="bmbar"></div>

  <div id="wv-host" style="flex:1;display:flex"></div>

  <div id="ext-panel" class="panel" style="min-width:280px;max-width:360px"></div>
  <div id="main-menu" class="panel" style="min-width:260px"></div>
  <div id="cmenu"     class="panel" style="min-width:140px"></div>
  <!-- URL bar 模糊匹配建议下拉 -->
  <div id="omnibox-suggest" class="panel" style="min-width:300px;max-width:640px;display:none;"></div>

<script>
const params = new URLSearchParams(location.search);
const profile = JSON.parse(params.get('profile') || '{}');
const initialUrl = params.get('initialUrl') || 'https://www.google.com';
const isSmall = params.get('small') === '1';
const isIncognito = params.get('incognito') === '1';

const themeColors = { red: '#FF3B30', green: '#34C759', yellow: '#FFCC00' };
const themeColor = themeColors[profile.theme] || '#FFCC00';

if (isSmall) document.body.classList.add('small');

// ─── 顶部 profile 条 ───
const strip = document.getElementById('strip');
strip.style.background = themeColor;
strip.innerHTML =
  `<span>${profile.emoji || '🐱'}  ${profile.name || ''}</span>`
  + (profile.note ? `<span class="note">· ${profile.note}</span>` : '')
  + (isIncognito ? '<span class="incog">🕶 无痕</span>' : '')
  + '<span class="ver" id="ver">v?.?.?</span>'
  + '<span class="mem" id="mem" title="主进程 + webview 子进程总占用，每 5 秒刷新">...</span>';

window.api.appVersion().then(v => {
  const el = document.getElementById('ver'); if (el) el.textContent = 'v' + v;
});

function fmtMem(kb) {
  const mb = kb / 1024;
  if (mb < 1024) return mb.toFixed(0) + ' MB';
  return (mb / 1024).toFixed(2) + ' GB';
}
window.api.onMemUpdate(({ kb, webviews }) => {
  const el = document.getElementById('mem'); if (!el) return;
  const mb = kb / 1024;
  el.textContent = fmtMem(kb);
  el.title = `主进程 + ${webviews} 个 webview 子进程\n每 5 秒刷新`;
  el.classList.toggle('warn', mb >= 500 && mb < 1024);
  el.classList.toggle('danger', mb >= 1024);
});

document.body.style.boxShadow = `inset 0 0 0 3px ${isIncognito ? '#1f1f1f' : themeColor}`;

// ─── webview ───
const wv = document.createElement('webview');
wv.id = 'wv';
const partition = isIncognito
  ? `meowser-incognito-${profile.id}-${Date.now()}`
  : `persist:meowser-${profile.id}`;
wv.setAttribute('partition', partition);
wv.setAttribute('allowpopups', '');
wv.style.cssText = 'flex:1;width:100%;height:100%;border:none;display:flex';
document.getElementById('wv-host').appendChild(wv);

// ─── Omnibox ───
const omnibox = document.getElementById('omnibox');
const urlInput = document.getElementById('url');
urlInput.addEventListener('focus', () => { omnibox.classList.add('focused'); urlInput.select(); });
urlInput.addEventListener('blur',  () => omnibox.classList.remove('focused'));

function navigate(text) {
  text = (text || '').trim(); if (!text) return;
  let url;
  if (text.includes('://') || text.startsWith('file:')) url = text;
  else if (!text.includes(' ') && text.includes('.')) url = 'https://' + text;
  else url = 'https://www.google.com/search?q=' + encodeURIComponent(text);
  wv.src = url;
}
// ─── URL bar 模糊匹配（输入历史 + 当前书签） ───
const suggestPanel = document.getElementById('omnibox-suggest');
let suggestItems = [];     // [{url, title, source: 'history'|'bookmark', visit_count?}]
let suggestIndex = -1;     // 当前高亮的索引；-1 = URL 输入本身
let suggestTimer = null;

function escForRegex(s){return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');}
function highlight(text, q) {
  if (!q) return escapeHtml(text);
  const re = new RegExp('(' + escForRegex(q) + ')', 'gi');
  return escapeHtml(text).replace(re, '<span class="hl">$1</span>');
}
function safeHostUrl(u){try{return new URL(u).hostname;}catch{return '';}}

async function refreshSuggestions(query) {
  query = (query || '').trim();
  if (!query) { hideSuggest(); return; }
  let pool = [];
  // 历史（已 visit_count 倒序排，前面是最常访问）
  try {
    const hist = await window.api.historySearch(profile.id, query, 50);
    pool = pool.concat(hist.map(h => ({ url: h.url, title: h.title || h.url, source: 'history', visit_count: h.visit_count })));
  } catch {}
  // 书签
  try {
    const bms = await window.api.listBookmarks(profile.id);
    const q = query.toLowerCase();
    const match = bms.filter(b => (b.title||'').toLowerCase().includes(q) || (b.url||'').toLowerCase().includes(q));
    // 书签优先级高一点：插到最前
    const seen = new Set(pool.map(x => x.url));
    match.forEach(b => { if (!seen.has(b.url)) pool.unshift({ url: b.url, title: b.title || b.url, source: 'bookmark' }); });
  } catch {}
  // 排重 + 取前 8
  const seen = new Set();
  suggestItems = [];
  for (const it of pool) {
    if (seen.has(it.url)) continue;
    seen.add(it.url);
    suggestItems.push(it);
    if (suggestItems.length >= 8) break;
  }
  renderSuggest(query);
}

function renderSuggest(q) {
  if (suggestItems.length === 0) { hideSuggest(); return; }
  suggestPanel.innerHTML = suggestItems.map((s, i) => `
    <div class="sugg${i===suggestIndex?' active':''}" data-i="${i}">
      <img src="https://www.google.com/s2/favicons?sz=32&domain=${encodeURIComponent(safeHostUrl(s.url))}" onerror="this.style.display='none'">
      <span class="t">${highlight(s.title, q)}</span>
      <span class="u">${highlight(s.url, q)}</span>
      ${s.source === 'bookmark' ? '<span class="v">⭐</span>' : (s.visit_count ? `<span class="v">${s.visit_count}×</span>` : '')}
    </div>`).join('');
  suggestPanel.querySelectorAll('.sugg').forEach(el => {
    el.onmouseenter = () => { suggestIndex = parseInt(el.dataset.i); highlightSelected(); };
    el.onclick = () => { const i = parseInt(el.dataset.i); navigate(suggestItems[i].url); hideSuggest(); };
  });
  const r = urlInput.getBoundingClientRect();
  suggestPanel.style.left = Math.round(r.left) + 'px';
  suggestPanel.style.top  = Math.round(r.bottom + 4) + 'px';
  suggestPanel.style.width = Math.round(r.width) + 'px';
  suggestPanel.style.display = 'block';
  suggestPanel.classList.add('show');
}
function highlightSelected() {
  suggestPanel.querySelectorAll('.sugg').forEach((el, i) => el.classList.toggle('active', i === suggestIndex));
}
function hideSuggest() {
  suggestPanel.style.display = 'none';
  suggestPanel.classList.remove('show');
  suggestIndex = -1;
}

urlInput.addEventListener('input', () => {
  clearTimeout(suggestTimer);
  suggestIndex = -1;
  suggestTimer = setTimeout(() => refreshSuggestions(urlInput.value), 80);
});
urlInput.addEventListener('blur', () => { setTimeout(hideSuggest, 150); });  // 给点击时间
urlInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    if (suggestIndex >= 0 && suggestItems[suggestIndex]) {
      navigate(suggestItems[suggestIndex].url);
    } else {
      navigate(urlInput.value);
    }
    hideSuggest();
    return;
  }
  if (e.key === 'Escape') {
    if (suggestPanel.style.display === 'block') { hideSuggest(); return; }
    urlInput.value = safeGetURL();
    urlInput.blur();
    return;
  }
  if (e.key === 'ArrowDown') {
    if (suggestItems.length === 0) return;
    e.preventDefault();
    suggestIndex = Math.min(suggestIndex + 1, suggestItems.length - 1);
    highlightSelected();
    return;
  }
  if (e.key === 'ArrowUp') {
    if (suggestItems.length === 0) return;
    e.preventDefault();
    suggestIndex = Math.max(suggestIndex - 1, -1);
    highlightSelected();
    return;
  }
});

// proxy chip
const px = profile.proxy || { type: 'direct' };
const proxyChip = document.getElementById('proxy-chip');
const proxyText = document.getElementById('proxy-text');
function applyProxyChip() {
  proxyChip.classList.remove('proxy-direct','proxy-http','proxy-socks','proxy-system');
  if (px.type === 'http' || px.type === 'https') {

function showPanelAt(id, anchorRect) {
  hideAllPanels();

  p.classList.add('show');
  const ph = p.offsetHeight, pw = p.offsetWidth;
  let left = Math.min(anchorRect.right - pw, window.innerWidth - pw - 8);
  let top  = anchorRect.bottom + 4;
  if (top + ph > window.innerHeight) top = anchorRect.top - ph - 4;
  p.style.left = Math.max(8, left) + 'px';

// 上版 bug：safeGetURL 在导航瞬间 / dom-ready 前会返回 ''，旧代码把空值
// 写回 urlInput → 用户看到"加载后 URL 消失"。新策略：**只在有真实 URL
// 时覆盖**，永不主动清空（除了首页 file:// home_*.html 显式清空一次）。
let lastSyncedUrl = '';
function syncUrl() {
  if (document.activeElement === urlInput) { updateStar(); return; }
  const u = safeGetURL();
  if (!u) return;  // 空值不动 — 保留上一次的 URL
  if (/^file:\/\/.*home_[a-z_0-9]+\.html$/i.test(u)) {
    // 工作区首页：留空让用户输入
    urlInput.value = '';
    lastSyncedUrl = '';
  } else {
    urlInput.value = u;
    lastSyncedUrl = u;
  }
  updateStar();
}

  const groups = new Map();

  });

  if (list.length === 0) {
    bar.innerHTML = '<span class="bm empty">无书签 — 点 ⭐ 添加</span>';

      { label: '系统 Safari 打开', click: () => window.api.openExternal(b.url, 'safari') },
      { label: '系统 Chrome 打开', click: () => window.api.openExternal(b.url, 'chrome') },
      { label: '复制链接',       click: () => window.api.copyText(b.url) },
      { label: '删除书签', danger: true, click: () => window.api.removeBookmark(profile.id, b.url) },
    ].forEach(it => {
      const d = document.createElement('div');
      d.className = 'row' + (it.danger ? ' danger' : '');
      d.innerHTML = `<span class="label">${it.label}</span>`;
      d.onclick = () => { hideAllPanels(); it.click(); };
      m.appendChild(d);
    });
    showPanelAt('cmenu', { left: e.clientX, right: e.clientX, top: e.clientY, bottom: e.clientY });
  };
  return el;
}

function safeHost(u) { try { return new URL(u).hostname; } catch { return ''; } }
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

window.api.onBookmarksChanged((pid) => {
  if (pid === profile.id) { renderBmbar(); refreshBookmarkedSet(); }
});
renderBmbar();
refreshBookmarkedSet();

// ─── 扩展图标渲染到工具栏右侧（Chrome 风）───
async function renderPinnedExts() {
  const wrap = document.getElementById('pinned-ext');
  wrap.innerHTML = '';
  if (isIncognito) return;
  let list = [];
  try { list = await window.api.listExtensions(profile.id); } catch { return; }
  // 只渲染有 action 的扩展（其他没有 popup 没意义）+ 显示 loaded/failed 状态
  for (const ext of list) {
    if (!ext.action) continue;
    const btn = document.createElement('button');
    btn.className = 'ext-action-btn' + (ext.state === 'failed' ? ' failed' : '');
    btn.title = (ext.action.title || ext.name) + (ext.state === 'failed' ? ' · 加载失败' : '');
    if (ext.action.icon) {
      btn.innerHTML = `<img src="${ext.action.icon}" alt="${escapeHtml(ext.name)}">`;
    } else {
      // 取扩展名首字 fallback
      btn.classList.add('fallback');
      btn.textContent = (ext.name || '?').trim().charAt(0).toUpperCase();
    }
    btn.onclick = async () => {
      if (!ext.action.popup) {
        toast(`${ext.name} 没有 popup（只是 action 触发，未实现）`);
        return;
      }
      const r = btn.getBoundingClientRect();
      const popupW = 360, popupH = 480;
      // 算屏幕坐标：webview 的 BrowserWindow 内部坐标 + 估算窗口位置
      // 简化：让主进程在按钮"附近"开 popup
      const win = await window.api.openExtensionPopup({
        profileId: profile.id,
        extDir: ext.dir,
        anchor: { x: Math.round(window.screenX + r.right - popupW), y: Math.round(window.screenY + r.bottom + 4), w: popupW, h: popupH },
      });
      if (win && !win.ok) toast(`✗ ${win.msg}`, 'error');
    };
    wrap.appendChild(btn);
  }
}
renderPinnedExts();

// 自动更新状态推送
window.api.onUpdaterStatus(s => {
  if (s.state === 'found') {
    // 让用户主动操作，不强求重启
    const wantOpen = confirm(`Meowser ${s.version} 已发布（当前 v${s.current}）。\n\n点确定打开 GitHub Releases 下载 dmg；取消稍后处理。`);
    if (wantOpen) window.api.updaterOpenReleases();
  } else if (s.state === 'error') {
    console.error('[updater]', s.msg);
  }
});
</script>
