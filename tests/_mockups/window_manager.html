<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>窗口管理 · Meowser 原型</title>
<style>
  *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    background: #1d1d1f; color: #ededed;
    -webkit-user-select: none;
    display: flex; flex-direction: column;
    min-height: 100vh;
  }

  /* ─── 顶部状态条 ─── */
  .header {
    height: 56px; padding: 0 20px;
    display: flex; align-items: center; gap: 12px;
    background: rgba(255,255,255,0.03);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    -webkit-app-region: drag;
  }
  .title {
    font-size: 14px; font-weight: 600;
    display: flex; align-items: center; gap: 8px;
  }
  .title .emoji { font-size: 18px; }
  .stats {
    margin-left: 8px; font-size: 11px;
    font-family: ui-monospace, SF Mono, monospace;
    color: rgba(255,255,255,0.5);
    padding: 3px 8px; border-radius: 4px;
    background: rgba(255,255,255,0.05);
  }
  .header-actions { margin-left: auto; display: flex; gap: 6px; -webkit-app-region: no-drag; }
  .iconbtn {
    width: 30px; height: 30px;
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent; border: none; border-radius: 50%;
    cursor: pointer; color: #ededed;
  }
  .iconbtn:hover { background: rgba(255,255,255,0.08); }
  .iconbtn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* ─── 过滤 chips ─── */
  .filters {
    padding: 12px 20px; display: flex; gap: 6px;
    flex-wrap: wrap; align-items: center;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    height: 28px; padding: 0 12px;
    background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.8);
    border-radius: 14px; font-size: 12px; font-weight: 500;
    cursor: pointer; border: 1px solid transparent;
    transition: all 0.12s;
  }
  .chip:hover { background: rgba(255,255,255,0.10); }
  .chip.active { background: #1a73e8; color: white; }
  .chip .num {
    font-family: ui-monospace, SF Mono, monospace;
    font-size: 10px; opacity: 0.7;
    padding: 1px 5px; background: rgba(255,255,255,0.10);
    border-radius: 8px;
  }
  .chip.active .num { background: rgba(255,255,255,0.20); opacity: 0.95; }

  .search {
    margin-left: auto; height: 28px; width: 220px;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px; padding: 0 12px;
    font-size: 12px; color: #ededed; outline: none;
  }
  .search:focus { border-color: #1a73e8; background: rgba(255,255,255,0.08); }
  .search::placeholder { color: rgba(255,255,255,0.35); }

  /* ─── 批量条 ─── */
  .bulkbar {
    height: 0; overflow: hidden;
    background: #1a73e8; color: white;
    display: flex; align-items: center; padding: 0 20px; gap: 12px;
    transition: height 0.15s;
    font-size: 12px;
  }
  .bulkbar.show { height: 40px; }
  .bulkbar .btn {
    height: 26px; padding: 0 12px;
    background: rgba(255,255,255,0.18); color: white;
    border: none; border-radius: 13px;
    font-size: 12px; cursor: pointer; font-weight: 600;
  }
  .bulkbar .btn:hover { background: rgba(255,255,255,0.28); }
  .bulkbar .btn.danger { background: rgba(255,255,255,0.22); }
  .bulkbar .btn.danger:hover { background: rgba(255,255,255,0.32); }
  .bulkbar .spacer { flex: 1; }
  .bulkbar .cnt { font-weight: 600; }
  .bulkbar .clear { color: rgba(255,255,255,0.8); text-decoration: underline; cursor: pointer; font-size: 11px; }

  /* ─── 列表 ─── */
  .list { flex: 1; overflow-y: auto; padding: 4px 0; }
  .row {
    display: flex; align-items: center;
    padding: 12px 20px; gap: 14px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    cursor: pointer;
    transition: background 0.08s;
  }
  .row:hover { background: rgba(255,255,255,0.03); }
  .row.selected { background: rgba(26,115,232,0.15); }
  .row.selected:hover { background: rgba(26,115,232,0.20); }

  .row input[type=checkbox] {
    width: 16px; height: 16px; flex-shrink: 0;
    accent-color: #1a73e8;
    cursor: pointer;
  }

  .swatch {
    width: 4px; height: 36px; border-radius: 2px;
    flex-shrink: 0;
  }
  .swatch.yellow { background: #FFCC00; }
  .swatch.green  { background: #34C759; }
  .swatch.red    { background: #FF3B30; }
  .swatch.incog  { background: #6c2bd9; }

  .emoji-cell {
    width: 32px; height: 32px;
    display: inline-flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.06); border-radius: 8px;
    font-size: 18px; flex-shrink: 0;
  }

  .meta {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column; gap: 3px;
  }
  .meta .top {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 600;
  }
  .meta .top .name { color: #ededed; }
  .meta .top .badge {
    font-size: 10px; padding: 1px 6px;
    border-radius: 8px; font-weight: 600;
    text-transform: uppercase;
    font-family: ui-monospace, SF Mono, monospace;
    letter-spacing: 0.3px;
  }
  .badge.incog    { background: rgba(108,43,217,0.20); color: #b794f4; }
  .badge.small    { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.6); }
  .badge.focused  { background: rgba(52,199,89,0.20);  color: #4ade80; }
  .badge.pinned   { background: rgba(255,204,0,0.20);  color: #fbbf24; }

  .meta .title-line {
    font-size: 12px; color: rgba(255,255,255,0.7);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .meta .url-line {
    font-size: 11px; color: rgba(255,255,255,0.35);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-family: ui-monospace, SF Mono, monospace;
  }

  .col-mem, .col-time {
    flex-shrink: 0; text-align: right;
    font-family: ui-monospace, SF Mono, monospace;
    font-size: 12px;
  }
  .col-mem { width: 80px; }
  .col-mem .v { color: #ededed; font-weight: 600; }
  .col-mem .v.warn   { color: #fbbf24; }
  .col-mem .v.danger { color: #ff6b6b; }
  .col-mem .sub { font-size: 10px; color: rgba(255,255,255,0.4); margin-top: 2px; }

  .col-time { width: 70px; }
  .col-time .v { color: rgba(255,255,255,0.7); }
  .col-time .sub { font-size: 10px; color: rgba(255,255,255,0.35); margin-top: 2px; }

  .actions {
    display: flex; gap: 4px; flex-shrink: 0;
    opacity: 0;
    transition: opacity 0.1s;
  }
  .row:hover .actions { opacity: 1; }
  .actions .btn {
    width: 30px; height: 30px;
    background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.8);
    border: none; border-radius: 8px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .actions .btn:hover { background: rgba(255,255,255,0.14); }
  .actions .btn.danger:hover { background: rgba(255,59,48,0.25); color: #ff6b6b; }
  .actions .btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* ─── 底部批量操作条 ─── */
  .footer {
    padding: 12px 20px;
    background: rgba(255,255,255,0.03);
    border-top: 1px solid rgba(255,255,255,0.06);
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  .footer .btn {
    height: 32px; padding: 0 16px;
    background: rgba(255,255,255,0.06); color: #ededed;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 500;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .footer .btn:hover { background: rgba(255,255,255,0.10); }
  .footer .btn.danger {
    background: rgba(255,59,48,0.12); color: #ff6b6b;
    border-color: rgba(255,59,48,0.25);
  }
  .footer .btn.danger:hover { background: rgba(255,59,48,0.20); }
  .footer .spacer { flex: 1; }
  .footer .hint {
    font-size: 11px; color: rgba(255,255,255,0.4);
    display: flex; align-items: center; gap: 4px;
    font-family: ui-monospace, SF Mono, monospace;
  }
  .footer .hint kbd {
    padding: 1px 5px; background: rgba(255,255,255,0.06);
    border-radius: 3px; border: 1px solid rgba(255,255,255,0.08);
  }

  /* ─── 弹窗（确认） ─── */
  .modal-bg {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    display: none; align-items: center; justify-content: center;
    z-index: 999;
  }
  .modal-bg.show { display: flex; }
  .modal {
    background: #2a2a2c; border-radius: 12px; padding: 20px;
    width: 380px; box-shadow: 0 12px 48px rgba(0,0,0,0.5);
  }
  .modal h3 { font-size: 14px; margin-bottom: 8px; }
  .modal p { font-size: 12px; color: rgba(255,255,255,0.7); line-height: 1.5; margin-bottom: 16px; }
  .modal .btns { display: flex; gap: 8px; justify-content: flex-end; }
  .modal button {
    height: 30px; padding: 0 16px;
    border-radius: 6px; border: none; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .modal button.cancel { background: rgba(255,255,255,0.08); color: #ededed; }
  .modal button.confirm { background: #ff3b30; color: white; }

  /* 空态 */
  .empty {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: rgba(255,255,255,0.4);
    gap: 8px; padding: 40px;
  }
  .empty .ico { font-size: 32px; }
  .empty .msg { font-size: 13px; }
</style>
</head>
<body>
  <div class="header">
    <div class="title">
      <span class="emoji">🗂</span>
      <span>窗口管理</span>
      <span class="stats" id="stats">共 5 个窗口 · ~1.21 GB</span>
    </div>
    <div class="header-actions">
      <button class="iconbtn" title="刷新" id="btn-refresh">
        <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
      </button>
      <button class="iconbtn" title="关闭面板">
        <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
  </div>

  <div class="filters">
    <div class="chip active" data-filter="all">全部 <span class="num">5</span></div>
    <div class="chip" data-filter="p_default">🐱 默认 <span class="num">1</span></div>
    <div class="chip" data-filter="p_work">💻 工作 <span class="num">3</span></div>
    <div class="chip" data-filter="p_fun">🎮 娱乐 <span class="num">1</span></div>
    <div class="chip" data-filter="incog">🕶 无痕 <span class="num">1</span></div>
    <input class="search" placeholder="搜索 title 或 URL…" id="search">
  </div>

  <div class="bulkbar" id="bulkbar">
    <span class="cnt">已选 <span id="sel-cnt">2</span> 个</span>
    <button class="btn danger">关闭选中</button>
    <span class="clear" id="clear-sel">清除选择</span>
    <div class="spacer"></div>
  </div>

  <div class="list" id="list">
    <!-- 行由 JS 渲染 -->
  </div>

  <div class="footer">
    <button class="btn">
      <svg width="14" height="14" viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2"><path d="M5 13l4 4L19 7"/></svg>
      留聚焦 关其他
    </button>
    <button class="btn">关此工作区</button>
    <button class="btn">关所有无痕</button>
    <div class="spacer"></div>
    <button class="btn danger" id="btn-close-all">关全部</button>
    <span class="hint"><kbd>⌃⌘W</kbd> 唤起 · <kbd>esc</kbd> 关闭</span>
  </div>

  <div class="modal-bg" id="modal-bg">
    <div class="modal">
      <h3>关闭确认</h3>
      <p id="modal-msg">确认关闭 3 个窗口？其中 1 个检测到疑似未保存的输入。</p>
      <div class="btns">
        <button class="cancel" id="modal-cancel">取消</button>
        <button class="confirm" id="modal-confirm">关闭</button>
      </div>
    </div>
  </div>

<script>
// 假数据（生产环境从 IPC windows:list 拿）
const fake = [
  {
    window_id: 1, profile_id: 'p_default',
    profile_emoji: '🐱', profile_name: '默认', profile_theme: 'yellow',
    is_incognito: false, is_small: false, always_on_top: true,
    title: 'Google 搜索',
    url: 'https://www.google.com/search?q=meowser+electron',
    opened_at: minsAgo(3), last_focused_at: minsAgo(0),
    memory_kb: 312 * 1024, webview_count: 1,
    is_focused: true,
  },
  {
    window_id: 2, profile_id: 'p_work',
    profile_emoji: '💻', profile_name: '工作', profile_theme: 'green',
    is_incognito: false, is_small: false, always_on_top: true,
    title: 'GitHub: meowser-electron',
    url: 'https://github.com/len-svg/meowser-electron/pull/1',
    opened_at: minsAgo(21), last_focused_at: minsAgo(2),
    memory_kb: 580 * 1024, webview_count: 1,
    is_focused: false,
  },
  {
    window_id: 3, profile_id: 'p_work',
    profile_emoji: '💻', profile_name: '工作', profile_theme: 'green',
    is_incognito: false, is_small: true, always_on_top: false,
    title: 'Linear · Engineering board',
    url: 'https://linear.app/team/eng/active',
    opened_at: minsAgo(8), last_focused_at: minsAgo(5),
    memory_kb: 180 * 1024, webview_count: 1,
    is_focused: false,
  },
  {
    window_id: 4, profile_id: 'p_work',
    profile_emoji: '💻', profile_name: '工作', profile_theme: 'green',
    is_incognito: false, is_small: false, always_on_top: true,
    title: '飞书文档 — 2026Q2 OKR',
    url: 'https://feishu.cn/docs/xxxxxxxxxxxxxxxxxxxxx',
    opened_at: minsAgo(36), last_focused_at: minsAgo(15),
    memory_kb: 890 * 1024, webview_count: 1,
    is_focused: false,
  },
  {
    window_id: 5, profile_id: 'p_fun',
    profile_emoji: '🎮', profile_name: '娱乐', profile_theme: 'red',
    is_incognito: true, is_small: false, always_on_top: true,
    title: 'B站 · 摸鱼直播',
    url: 'https://live.bilibili.com/12345',
    opened_at: minsAgo(2), last_focused_at: minsAgo(1),
    memory_kb: 290 * 1024, webview_count: 1,
    is_focused: false,
  },
];

function minsAgo(m) {
  return new Date(Date.now() - m * 60 * 1000).toISOString();
}
function fmtAgo(iso) {
  if (!iso) return '—';
  const sec = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (sec < 60) return sec + 's';
  if (sec < 3600) return Math.floor(sec / 60) + 'm';
  if (sec < 86400) return Math.floor(sec / 3600) + 'h';
  return Math.floor(sec / 86400) + 'd';
}
function fmtMem(kb) {
  const mb = kb / 1024;
  if (mb < 1024) return { v: Math.round(mb), unit: 'MB', warn: mb >= 500, danger: mb >= 800 };
  return { v: (mb / 1024).toFixed(2), unit: 'GB', warn: false, danger: true };
}

const state = {
  filter: 'all',
  search: '',
  selected: new Set(),
};

function filtered() {
  return fake.filter(w => {
    if (state.filter !== 'all') {
      if (state.filter === 'incog') return w.is_incognito;
      if (w.profile_id !== state.filter) return false;
    }
    if (state.search) {
      const q = state.search.toLowerCase();
      if (!w.title.toLowerCase().includes(q) && !w.url.toLowerCase().includes(q)) return false;
    }
    return true;
  });
}

function render() {
  const list = document.getElementById('list');
  list.innerHTML = '';
  const rows = filtered();

  if (rows.length === 0) {
    const e = document.createElement('div');
    e.className = 'empty';
    e.innerHTML = '<div class="ico">🪟</div><div class="msg">没有匹配窗口</div>';
    list.appendChild(e);
  } else {
    rows.forEach(w => list.appendChild(makeRow(w)));
  }

  // 顶部 stats
  const totalKb = fake.reduce((s, w) => s + w.memory_kb, 0);
  const totalGb = (totalKb / 1024 / 1024).toFixed(2);
  document.getElementById('stats').textContent = `共 ${fake.length} 个窗口 · ~${totalGb} GB`;

  // 批量条
  const bulkbar = document.getElementById('bulkbar');
  bulkbar.classList.toggle('show', state.selected.size > 0);
  document.getElementById('sel-cnt').textContent = state.selected.size;
}

function makeRow(w) {
  const row = document.createElement('div');
  row.className = 'row' + (state.selected.has(w.window_id) ? ' selected' : '');
  const swatchClass = w.is_incognito ? 'incog' : w.profile_theme;
  const mem = fmtMem(w.memory_kb);
  const memClass = mem.danger ? 'danger' : (mem.warn ? 'warn' : '');

  row.innerHTML = `
    <input type="checkbox" ${state.selected.has(w.window_id) ? 'checked' : ''}>
    <div class="swatch ${swatchClass}"></div>
    <div class="emoji-cell">${w.profile_emoji}</div>
    <div class="meta">
      <div class="top">
        <span class="name">${escapeHtml(w.profile_name)}</span>
        ${w.is_focused ? '<span class="badge focused">● 聚焦中</span>' : ''}
        ${w.is_incognito ? '<span class="badge incog">无痕</span>' : ''}
        ${w.is_small ? '<span class="badge small">小窗</span>' : ''}
        ${w.always_on_top ? '<span class="badge pinned">置顶</span>' : ''}
      </div>
      <div class="title-line">${escapeHtml(w.title)}</div>
      <div class="url-line">${escapeHtml(w.url)}</div>
    </div>
    <div class="col-mem">
      <div class="v ${memClass}">${mem.v} ${mem.unit}</div>
      <div class="sub">${w.webview_count} webview</div>
    </div>
    <div class="col-time">
      <div class="v">已开 ${fmtAgo(w.opened_at)}</div>
      <div class="sub">${w.last_focused_at ? '聚焦 ' + fmtAgo(w.last_focused_at) + '前' : '从未聚焦'}</div>
    </div>
    <div class="actions">
      <button class="btn" title="聚焦此窗">
        <svg viewBox="0 0 24 24"><path d="M9 17h6m-3-12v9m-9-3l4-4 4 4m6 0l-4-4-4 4"/></svg>
      </button>
      <button class="btn" title="切换大/小窗">
        <svg viewBox="0 0 24 24"><path d="M3 3h7v7H3zM14 14h7v7h-7zM14 3h7v7h-7zM3 14h7v7H3z"/></svg>
      </button>
      <button class="btn danger" title="关闭此窗">
        <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
  `;

  // checkbox 拦截避免冒泡触发整行
  const cb = row.querySelector('input[type=checkbox]');
  cb.addEventListener('click', e => {
    e.stopPropagation();
    if (cb.checked) state.selected.add(w.window_id);
    else state.selected.delete(w.window_id);
    render();
  });

  // 整行点击 = 聚焦该窗口（生产环境）
  row.addEventListener('click', e => {
    if (e.target.closest('.actions') || e.target.closest('input')) return;
    toast(`聚焦窗口 #${w.window_id} (${w.profile_name})`);
  });

  // 关闭按钮
  row.querySelector('.btn.danger').addEventListener('click', e => {
    e.stopPropagation();
    askClose([w]);
  });

  return row;
}

function askClose(wins) {
  const msg = wins.length === 1
    ? `确认关闭「${wins[0].profile_emoji} ${wins[0].profile_name} · ${wins[0].title}」？`
    : `确认关闭 ${wins.length} 个窗口？`;
  document.getElementById('modal-msg').textContent = msg;
  document.getElementById('modal-bg').classList.add('show');
  document.getElementById('modal-confirm').onclick = () => {
    document.getElementById('modal-bg').classList.remove('show');
    wins.forEach(w => {
      const i = fake.findIndex(x => x.window_id === w.window_id);
      if (i >= 0) fake.splice(i, 1);
      state.selected.delete(w.window_id);
    });
    render();
    toast(`已关闭 ${wins.length} 个窗口`);
  };
  document.getElementById('modal-cancel').onclick = () => {
    document.getElementById('modal-bg').classList.remove('show');
  };
}

function toast(msg) {
  const t = document.createElement('div');
  t.textContent = msg;
  Object.assign(t.style, {
    position: 'fixed', bottom: '24px', left: '50%', transform: 'translateX(-50%)',
    background: '#1a73e8', color: 'white',
    padding: '8px 16px', borderRadius: '6px', fontSize: '12px',
    zIndex: 9999, boxShadow: '0 4px 12px rgba(0,0,0,0.4)',
  });
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 1500);
}

function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

// 事件
document.querySelectorAll('.chip').forEach(c => {
  c.onclick = () => {
    document.querySelectorAll('.chip').forEach(x => x.classList.remove('active'));
    c.classList.add('active');
    state.filter = c.dataset.filter;
    render();
  };
});
document.getElementById('search').oninput = e => { state.search = e.target.value; render(); };
document.getElementById('clear-sel').onclick = () => { state.selected.clear(); render(); };
document.getElementById('btn-refresh').onclick = () => toast('已刷新（mock 不变）');
document.getElementById('btn-close-all').onclick = () => askClose([...fake]);
document.querySelector('.bulkbar .btn.danger').onclick = () => {
  const wins = fake.filter(w => state.selected.has(w.window_id));
  askClose(wins);
};

// 自动刷新时间显示（每 30s）
setInterval(render, 30000);

render();
</script>
</body>
